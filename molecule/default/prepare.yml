---
- name: Prepare MediaWiki Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for MediaWiki Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    # sqlite3 is what the verify play reads MediaWiki's database with, from
    # outside the container and without going through MediaWiki itself.
    - name: Ensure required packages are installed for MediaWiki Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          - sqlite3
        state: present

    - name: Ensure Docker is installed for MediaWiki Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

---
- name: Verify nothing was quietly restarting while all of that was being checked
  when: "mediawiki_restarts_check_enabled | bool"
  block:
    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # which is what a MediaWiki that cannot reach its database would do. The
    # window starts here, with the wiki already answering, because the restart
    # which loaded LocalSettings.php legitimately bumps the counter.
    - name: Sample the restart counters
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: mediawiki_restarts_before
      loop: "{{ mediawiki_verify_units }}"

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the services for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the restart counters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: mediawiki_restarts_after
      loop: "{{ mediawiki_verify_units }}"

    - name: Assert no service restarted while it was up
      ansible.builtin.assert:
        that:
          - mediawiki_restarts_after.results | map(attribute='status.NRestarts') | list == mediawiki_restarts_before.results | map(attribute='status.NRestarts') | list
          - mediawiki_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
        fail_msg: >-
          A service restarted while it was supposedly up, so `active` was hiding a crash loop.
          Before:
          {% for unit, restarts in mediawiki_verify_units | zip(mediawiki_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})
          after:
          {% for unit, restarts in mediawiki_verify_units | zip(mediawiki_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
        success_msg: >-
          None of the services restarted over 45 seconds of watching (restarts so far:
          {% for unit, restarts in mediawiki_verify_units | zip(mediawiki_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

---
- name: Verify MediaWiki
  hosts: all
  become: true
  gather_facts: false

  vars:
    mediawiki_verify_api_url: "{{ mediawiki_molecule_url }}/api.php"

    # How MediaWiki stores a page title: spaces become underscores.
    mediawiki_verify_page_db_title: "{{ mediawiki_molecule_page_title | replace(' ', '_') }}"

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: mediawiki_defaults

    # ------------------------------------------------------------------
    # The unit is up
    # ------------------------------------------------------------------

    - name: Wait for the MediaWiki service to become active (up to 3m)
      ansible.builtin.systemd_service:
        name: mediawiki.service
      register: mediawiki_service
      until: mediawiki_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the MediaWiki service is active
      ansible.builtin.assert:
        that: mediawiki_service.status.ActiveState == 'active'
        fail_msg: "mediawiki.service is not active ({{ mediawiki_service.status.ActiveState }})"
        success_msg: "mediawiki.service is active"

    - name: Retrieve the MediaWiki service log for debugging
      when: mediawiki_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mediawiki.service
      changed_when: false

    # ------------------------------------------------------------------
    # The wiki is installed, and is the version this role pins
    # ------------------------------------------------------------------

    # An uninstalled MediaWiki answers 200 with an HTML setup page here (the
    # side effect play proves it does), so waiting for a status code would be
    # waiting for nothing. JSON with a `generator` in it is the first thing a
    # wiki without a LocalSettings.php cannot produce - and it takes a while to
    # arrive, because PHP and the database both warm up after the restart which
    # loaded the configuration file.
    - name: Wait for MediaWiki to answer its API with site info (up to 10m)
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}?action=query&meta=siteinfo&format=json"
        return_content: true
        status_code: [200]
      register: mediawiki_siteinfo
      until: '''"generator"'' in mediawiki_siteinfo.content'
      retries: 120
      delay: 5

    # `generator` is the version of the code answering the request, which is
    # what ties the running wiki to the leaf variable Renovate bumps. It is
    # prefix-matched, so that a `1.43.9`-plus-something image would still pass
    # while a wiki from another release line would not.
    - name: Assert MediaWiki is installed, configured and running the pinned version
      ansible.builtin.assert:
        that:
          - mediawiki_siteinfo.json.query.general.generator is match('MediaWiki ' ~ (mediawiki_defaults.mediawiki_version | string | regex_escape))
          - mediawiki_siteinfo.json.query.general.sitename == mediawiki_config_sitename
          - mediawiki_siteinfo.json.query.general.dbtype == mediawiki_database_type
          - mediawiki_siteinfo.json.query.general.lang == mediawiki_defaults.mediawiki_config_lang
          - mediawiki_siteinfo.json.query.general.timezone == mediawiki_defaults.mediawiki_config_localtimezone
        fail_msg: >-
          MediaWiki does not report what the role configured
          (expected MediaWiki {{ mediawiki_defaults.mediawiki_version }},
          sitename {{ mediawiki_config_sitename }},
          dbtype {{ mediawiki_database_type }}):
          {{ mediawiki_siteinfo.json.query.general | default({}) }}
        success_msg: >-
          MediaWiki reports itself as
          "{{ mediawiki_siteinfo.json.query.general.generator }}" serving
          "{{ mediawiki_siteinfo.json.query.general.sitename }}" on
          {{ mediawiki_siteinfo.json.query.general.dbtype }}
          {{ mediawiki_siteinfo.json.query.general.dbversion | default('') }}

    # ------------------------------------------------------------------
    # The wiki can be logged into and written to through its API
    # ------------------------------------------------------------------

    - name: Request a MediaWiki login token
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}?action=query&meta=tokens&type=login&format=json"
        status_code: [200]
      register: mediawiki_login_token

    # The login token is only good for the session it was issued to, so every
    # request from here on carries the cookies collected so far. `uri` returns
    # cookies but does not send them, and omits the key entirely on a non-2xx
    # response, hence the defaults.
    - name: Collect the MediaWiki session cookies
      ansible.builtin.set_fact:
        mediawiki_cookies: "{{ mediawiki_login_token.cookies | default({}) }}"

    - name: Log in to MediaWiki with the administrator account the installer created
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          action: clientlogin
          format: json
          username: "{{ admin_username }}"
          password: "{{ admin_password }}"
          logintoken: "{{ mediawiki_login_token.json.query.tokens.logintoken }}"
          loginreturnurl: "{{ mediawiki_molecule_url }}/"
        headers:
          Cookie: "{{ mediawiki_cookies.items() | map('join', '=') | join('; ') }}"
        status_code: [200]
      register: mediawiki_login

    - name: Collect the MediaWiki session cookies again
      ansible.builtin.set_fact:
        mediawiki_cookies: "{{ mediawiki_cookies | combine(mediawiki_login.cookies | default({})) }}"

    - name: Ask MediaWiki who it thinks is calling
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}?action=query&meta=userinfo&format=json"
        headers:
          Cookie: "{{ mediawiki_cookies.items() | map('join', '=') | join('; ') }}"
        status_code: [200]
      register: mediawiki_userinfo

    - name: Assert MediaWiki accepted the administrator credentials
      ansible.builtin.assert:
        that:
          - mediawiki_login.json.clientlogin.status | default('') == 'PASS'
          - mediawiki_login.json.clientlogin.username | default('') == mediawiki_molecule_admin_wiki_username
          - mediawiki_userinfo.json.query.userinfo.name == mediawiki_molecule_admin_wiki_username
          - mediawiki_userinfo.json.query.userinfo.id | int > 0
        fail_msg: >-
          Logging in as {{ admin_username }} did not work
          ({{ mediawiki_login.json | default({}) }}), so the account
          `run.php install` was told to create is not usable
        success_msg: >-
          MediaWiki accepted the account the installer created and considers the
          caller {{ mediawiki_userinfo.json.query.userinfo.name }}
          (user id {{ mediawiki_userinfo.json.query.userinfo.id }})

    - name: Request a MediaWiki edit token
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}?action=query&meta=tokens&type=csrf&format=json"
        headers:
          Cookie: "{{ mediawiki_cookies.items() | map('join', '=') | join('; ') }}"
        status_code: [200]
      register: mediawiki_csrf_token

    # A caller without a session gets the fixed anonymous token `+\`, and this
    # wiki does accept anonymous edits, so an edit succeeding proves nothing
    # about the login on its own. A real token means the session survived.
    - name: Assert the edit token belongs to a logged-in session
      ansible.builtin.assert:
        that:
          - mediawiki_csrf_token.json.query.tokens.csrftoken != '+\\'
          - mediawiki_csrf_token.json.query.tokens.csrftoken | length > 10
        fail_msg: >-
          MediaWiki issued the anonymous edit token
          ({{ mediawiki_csrf_token.json.query.tokens.csrftoken }}), so the
          session did not carry over
        success_msg: "MediaWiki issued an edit token for the logged-in session"

    - name: Create a page through the MediaWiki API
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          action: edit
          format: json
          title: "{{ mediawiki_molecule_page_title }}"
          text: "{{ mediawiki_molecule_page_text }}"
          token: "{{ mediawiki_csrf_token.json.query.tokens.csrftoken }}"
        headers:
          Cookie: "{{ mediawiki_cookies.items() | map('join', '=') | join('; ') }}"
        status_code: [200]
      register: mediawiki_edit

    - name: Assert MediaWiki accepted the edit
      ansible.builtin.assert:
        that:
          - mediawiki_edit.json.edit.result | default('') == 'Success'
          - mediawiki_edit.json.edit.title | default('') == mediawiki_molecule_page_title
          - mediawiki_edit.json.edit.newrevid | default(0) | int > 0
        fail_msg: "MediaWiki refused the edit: {{ mediawiki_edit.json | default({}) }}"
        success_msg: >-
          MediaWiki stored "{{ mediawiki_edit.json.edit.title }}" as
          revision {{ mediawiki_edit.json.edit.newrevid }}

    # Read back without the session cookies: what comes out has to have been
    # stored, rather than echoed back by the request which wrote it.
    - name: Read the page back out of MediaWiki
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}?action=query&format=json&prop=revisions&rvprop=content%7Cuser&rvslots=main&titles={{ mediawiki_molecule_page_title | urlencode }}"
        status_code: [200]
      register: mediawiki_page

    - name: Make sense of the page MediaWiki returned
      ansible.builtin.set_fact:
        mediawiki_revision: "{{ ((mediawiki_page.json.query.pages | dict2items | first).value.revisions | default([{}])) | first }}"

    - name: Assert the page came back with its text and its author
      ansible.builtin.assert:
        that:
          - mediawiki_revision.slots.main['*'] | default('') == mediawiki_molecule_page_text
          - mediawiki_revision.user | default('') == mediawiki_molecule_admin_wiki_username
        fail_msg: >-
          MediaWiki did not return the page which was just written:
          {{ mediawiki_page.json.query.pages | default({}) }}
        success_msg: >-
          MediaWiki returns the page as written, attributed to
          {{ mediawiki_revision.user }} - so the edit went in as the
          administrator rather than anonymously

    - name: Ask MediaWiki to render the page
      ansible.builtin.uri:
        url: "{{ mediawiki_verify_api_url }}?action=parse&format=json&page={{ mediawiki_molecule_page_title | urlencode }}"
        status_code: [200]
      register: mediawiki_parsed

    - name: Assert MediaWiki renders the page
      ansible.builtin.assert:
        that: mediawiki_molecule_page_text in (mediawiki_parsed.json.parse.text['*'] | default(''))
        fail_msg: >-
          MediaWiki did not render the page:
          {{ mediawiki_parsed.json | default({}) | string | truncate(300) }}
        success_msg: "MediaWiki renders the page it was asked to store"

    # ------------------------------------------------------------------
    # The page is in the database this scenario configured, not somewhere else
    # ------------------------------------------------------------------

    # MediaWiki falls back to nothing: either it is talking to the MariaDB this
    # scenario configured, or it is not working. A SQLite file appearing here
    # would mean the wiki quietly installed itself somewhere else entirely.
    - name: Look for a SQLite database MediaWiki must not have created
      ansible.builtin.find:
        paths: "{{ mediawiki_molecule_database_path }}"
        patterns: "*.sqlite"
      register: mediawiki_sqlite_files

    # Read with MariaDB's own client inside the database container, entirely
    # outside MediaWiki: what comes out is what the database server holds,
    # rather than what the wiki says about itself. The same database answered
    # `SHOW TABLES` with nothing at all before the installation.
    - name: Read the wiki's own tables out of MariaDB
      ansible.builtin.command:
        cmd: >-
          {{ mediawiki_molecule_mariadb_query }}
          "SELECT page_title FROM page; SELECT user_name FROM user; SELECT old_text FROM text"
      register: mediawiki_mariadb_query
      changed_when: false

    - name: Assert the wiki lives in the MariaDB database this scenario configured
      ansible.builtin.assert:
        that:
          - mediawiki_sqlite_files.files | length == 0
          - mediawiki_verify_page_db_title in mediawiki_mariadb_query.stdout_lines
          - mediawiki_molecule_admin_wiki_username in mediawiki_mariadb_query.stdout_lines
          - mediawiki_molecule_page_text in mediawiki_mariadb_query.stdout_lines
        fail_msg: >-
          The MariaDB database does not hold the page, the user and the text
          which were just written ({{ mediawiki_mariadb_query.stdout_lines }}),
          or MediaWiki created a SQLite database instead
          ({{ mediawiki_sqlite_files.files | map(attribute='path') | list }})
        success_msg: >-
          The MariaDB database this scenario configured holds the page
          ({{ mediawiki_verify_page_db_title }}), the administrator account and
          the page text, read with MariaDB's own client - and no SQLite database
          was created

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # which is what a MediaWiki that cannot reach its database would do. The
    # window starts here, with the wiki already answering, because the restart
    # which loaded LocalSettings.php legitimately bumps the counter.
    - name: Sample the MediaWiki restart counter
      ansible.builtin.systemd_service:
        name: mediawiki.service
      register: mediawiki_restarts_before

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has
    # to tick at least once inside the window.
    - name: Watch the MediaWiki service for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the MediaWiki restart counter again
      ansible.builtin.systemd_service:
        name: mediawiki.service
      register: mediawiki_restarts_after

    - name: Assert MediaWiki did not restart while it was up
      ansible.builtin.assert:
        that:
          - mediawiki_restarts_after.status.NRestarts == mediawiki_restarts_before.status.NRestarts
          - mediawiki_restarts_after.status.ActiveState == 'active'
        fail_msg: >-
          MediaWiki restarted while it was supposedly up
          ({{ mediawiki_restarts_before.status.NRestarts }} ->
          {{ mediawiki_restarts_after.status.NRestarts }}), so `active` was
          hiding a crash loop
        success_msg: >-
          MediaWiki did not restart over 45 seconds of watching
          (restarts so far: {{ mediawiki_restarts_after.status.NRestarts }})

    - name: Show the MediaWiki verification summary
      ansible.builtin.debug:
        msg:
          - "systemd: {{ mediawiki_service.status.ActiveState }}, restarts {{ mediawiki_restarts_after.status.NRestarts }}"
          - "uninstalled wiki: 200 with its setup page and no JSON (asserted in the side effect play)"
          - "siteinfo: {{ mediawiki_siteinfo.json.query.general.generator }}, sitename {{ mediawiki_siteinfo.json.query.general.sitename }}, dbtype {{ mediawiki_siteinfo.json.query.general.dbtype }} {{ mediawiki_siteinfo.json.query.general.dbversion | default('') }}"
          - "login: {{ mediawiki_login.json.clientlogin.status }} as {{ mediawiki_userinfo.json.query.userinfo.name }}"
          - "edit: {{ mediawiki_edit.json.edit.result }}, revision {{ mediawiki_edit.json.edit.newrevid }}, attributed to {{ mediawiki_revision.user }}"
          - "database: MariaDB holds {{ mediawiki_verify_page_db_title }}, no SQLite database was created"

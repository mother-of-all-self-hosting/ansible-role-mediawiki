---
- name: Verify MediaWiki systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for MediaWiki service to become active (up to 180s)
      ansible.builtin.systemd:
        name: mediawiki.service
      register: mediawiki_service
      until: mediawiki_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert MediaWiki service is active
      ansible.builtin.assert:
        that: mediawiki_service.status.ActiveState == 'active'
        fail_msg: "mediawiki.service not active ({{ mediawiki_service.status.ActiveState }})"
        success_msg: "mediawiki.service is active"

    - name: Retrieve MediaWiki service log for debugging
      when: mediawiki_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mediawiki.service
      changed_when: false

    - name: Wait for MediaWiki HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:80/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: mediawiki_endpoint
      until: mediawiki_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert MediaWiki HTTP endpoint responds
      ansible.builtin.assert:
        that: mediawiki_endpoint.status in [200, 302]
        fail_msg: "MediaWiki did not respond as expected ({{ mediawiki_endpoint.status | default('no response') }})"
        success_msg: "MediaWiki responded with {{ mediawiki_endpoint.status }}"

    - name: Show MediaWiki systemd service status summary
      ansible.builtin.debug:
        msg:
          - "MediaWiki systemd: {{ mediawiki_service.status.ActiveState }}"
          - "MediaWiki HTTP: {{ mediawiki_endpoint.status }}"

---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: mediawiki-${MOLECULE_DISTRO:-ubuntu2604}-mariadb
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        mediawiki_debug_service_enabled: false

        # Variables for MediaWiki
        mediawiki_uid: 1000
        mediawiki_gid: 1000
        mediawiki_scheme: http
        mediawiki_hostname: localhost
        mediawiki_container_labels_traefik_enabled: false
        mediawiki_container_http_host_bind_port: 80
        mediawiki_config_sitename: mediawiki

        # Variables required for MediaWiki to connect to the MariaDB database
        mediawiki_database_type: mysql
        mediawiki_database_mysql_hostname: "{{ mariadb_connection_hostname }}"
        mediawiki_database_mysql_port: "{{ mariadb_connection_port }}"
        mediawiki_database_mysql_username: my_database_username
        mediawiki_database_mysql_password: my_database_password
        mediawiki_database_name: mediawiki
        mediawiki_systemd_required_services_list_auto: |
          {{
            (['mariadb.service'])
          }}

        # The wiki this scenario installs and then logs into over its API.
        # `admin_username` and `admin_password` are the names the role's
        # `install-cli-mediawiki` tasks expect: an operator passes them with
        # --extra-vars, this scenario passes them through the inventory.
        admin_username: molecule-admin
        admin_password: molecule-verification-pass

        # MediaWiki capitalizes the first letter of every account name, so this
        # is what the wiki calls the account above.
        mediawiki_molecule_admin_wiki_username: Molecule-admin

        # `mediawiki_hostname` is what the wiki was installed as, so requests go
        # to the same name rather than to 127.0.0.1.
        mediawiki_molecule_url: http://localhost

        mediawiki_molecule_page_title: Molecule Verification Page
        mediawiki_molecule_page_text: molecule-marker-mariadb-3b7e40

        # The role's own `mediawiki_database_path`, spelled out because role
        # defaults are not in scope in a verify play. The side effect play
        # asserts that the two still agree. Nothing should ever appear in it in
        # this scenario - a SQLite file here would mean the wiki is not on
        # MariaDB at all.
        mediawiki_molecule_database_path: /mediawiki/data/database

        # MariaDB's own client, run inside the container the MariaDB role
        # started, which is how the side effect and verify plays read the
        # database without going through MediaWiki. `--batch
        # --skip-column-names` makes it print one bare value per line, which is
        # what the assertions match against.
        #
        # The MariaDB role also installs a `cli-non-interactive` helper, which
        # would be the natural thing to use, but the version pinned in
        # requirements.yml renders it without `docker run -i`: it reads no
        # standard input at all and answers every query with nothing, silently.
        mediawiki_molecule_mariadb_query: >-
          docker exec mariadb
          mariadb --user=root --password={{ mariadb_root_password }}
          --database={{ mediawiki_database_name }} --batch --skip-column-names --execute

        # Variables for MariaDB
        mariadb_uid: 1000
        mariadb_gid: 1000
        mariadb_root_password: mariadb_password
        mariadb_container_network: "{{ mediawiki_container_network }}"
        # The database the CLI helper above connects to.
        mariadb_db_name: "{{ mediawiki_database_name }}"
        mariadb_managed_databases: |
          {{
            [{
              'name': mediawiki_database_name,
              'username': mediawiki_database_mysql_username,
              'password': mediawiki_database_mysql_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-mariadb
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible

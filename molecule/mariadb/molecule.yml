---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: mediawiki-${MOLECULE_DISTRO:-ubuntu2604}-mariadb
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        mediawiki_debug_service_enabled: false

        # Variables for MediaWiki
        mediawiki_uid: 1000
        mediawiki_gid: 1000
        mediawiki_scheme: http
        mediawiki_hostname: localhost
        mediawiki_container_labels_traefik_enabled: false
        mediawiki_container_http_host_bind_port: 80
        mediawiki_config_sitename: mediawiki

        # Variables required for MediaWiki to connect to the MariaDB database
        mediawiki_database_type: mysql
        mediawiki_database_mysql_hostname: "{{ mariadb_connection_hostname }}"
        mediawiki_database_mysql_port: "{{ mariadb_connection_port }}"
        mediawiki_database_mysql_username: my_database_username
        mediawiki_database_mysql_password: my_database_password
        mediawiki_database_name: mediawiki
        mediawiki_systemd_required_services_list_auto: |
          {{
            (['mariadb.service'])
          }}

        # Variables for MariaDB
        mariadb_uid: 1000
        mariadb_gid: 1000
        mariadb_root_password: mariadb_password
        mariadb_container_network: "{{ mediawiki_container_network }}"
        mariadb_managed_databases: |
          {{
            [{
              'name': mediawiki_database_name,
              'username': mediawiki_database_mysql_username,
              'password': mediawiki_database_mysql_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-mariadb
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
